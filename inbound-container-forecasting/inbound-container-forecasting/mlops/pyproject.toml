[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inbound-forecast"
version = "1.0.0"
description = "Inbound container volume forecasting: training, inference and monitoring on Vertex AI"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pyarrow>=14",
  "db-dtypes>=1.2",
  "google-cloud-bigquery>=3.17",
  "google-cloud-aiplatform>=1.70",
  "google-cloud-storage>=2.14",
]

[project.optional-dependencies]
pipelines = ["kfp>=2.8,<3", "google-cloud-pipeline-components>=2.14"]
dev = ["pytest>=8", "ruff>=0.5", "kfp>=2.8,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../tests"]
